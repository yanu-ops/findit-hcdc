<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer magnifying glass ring -->
  <circle cx="42" cy="42" r="34" fill="#1E2A5E"/>
  <!-- White lens -->
  <circle cx="42" cy="42" r="26" fill="white"/>
  <!-- Globe circle -->
  <circle cx="42" cy="42" r="18" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
  <!-- Globe horizontal lines -->
  <line x1="24" y1="42" x2="60" y2="42" stroke="#60A5FA" stroke-width="2"/>
  <line x1="25.5" y1="33" x2="58.5" y2="33" stroke="#60A5FA" stroke-width="1.8"/>
  <line x1="25.5" y1="51" x2="58.5" y2="51" stroke="#60A5FA" stroke-width="1.8"/>
  <!-- Globe vertical meridian -->
  <line x1="42" y1="24" x2="42" y2="60" stroke="#60A5FA" stroke-width="2"/>
  <!-- Globe curved meridian -->
  <ellipse cx="42" cy="42" rx="9" ry="18" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <!-- Handle -->
  <line x1="63" y1="63" x2="80" y2="80" stroke="#1E2A5E" stroke-width="11" stroke-linecap="round"/>
</svg>